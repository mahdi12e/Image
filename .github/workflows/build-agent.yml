name: Build and deploy PhotoCraft AI Agent

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkout PhotoCraft v0.2.0
        run: git clone --depth 1 --branch v0.2.0 https://github.com/storytold/photocraft.git upstream
      - name: Patch PhotoCraft
        run: python3 scripts/patch_upstream.py
      - name: Install Rust wasm target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
          sudo apt-get update
          sudo apt-get install -y brotli
      - name: Install Trunk
        run: cargo install trunk --locked
      - name: Build PhotoCraft
        working-directory: upstream/apps/photocraft-web
        run: trunk build --release
      - name: Prepare assets
        run: |
          rm -rf site
          mkdir -p site
          cp -a upstream/dist/web/. site/
          WASM_FILE=$(find site -maxdepth 1 -type f -name '*.wasm' -print -quit)
          test -n "$WASM_FILE"
          brotli -q 11 -f "$WASM_FILE" -o "$WASM_FILE.br"
          rm "$WASM_FILE"
          cp _headers site/_headers || true
          cp .htaccess site/.htaccess || true
      - name: Deploy
        if: env.CF_TOKEN != '' && env.CF_ACCOUNT != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        run: npx --yes wrangler@4.147.0 deploy
      - name: Upload artifact without Cloudflare secrets
        if: env.CF_TOKEN == '' || env.CF_ACCOUNT == ''
        uses: actions/upload-artifact@v4
        with:
          name: photocraft-ai-site
          path: site
          retention-days: 7
